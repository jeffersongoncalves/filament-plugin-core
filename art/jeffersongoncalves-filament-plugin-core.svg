<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#FBBF24" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#27272A" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <ellipse cx="950" cy="310" rx="410" ry="290" fill="url(#glow)"/>

  <!-- Top label -->
  <circle cx="82" cy="66" r="4" fill="#FBBF24"/>
  <text x="104" y="71" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="2" fill="#A1A1AA">FILAMENT FOUNDATION</text>

  <!-- Title -->
  <text x="80" y="262" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-2" fill="#FAFAFA">Filament</text>
  <text x="80" y="332" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-2" fill="#FAFAFA">Plugin Core</text>

  <!-- Tagline -->
  <text x="80" y="388" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#FBBF24">Base classes for every Filament plugin</text>

  <!-- Description -->
  <text x="80" y="430" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#A1A1AA">BasePlugin, BasePackageServiceProvider and</text>
  <text x="80" y="456" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#A1A1AA">render-hook helpers — zero boilerplate.</text>

  <!-- Footer pills -->
  <g font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">
    <rect x="80" y="545" width="92" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="126" y="565" text-anchor="middle" fill="#A1A1AA">PHP 8.2</text>

    <rect x="182" y="545" width="108" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="236" y="565" text-anchor="middle" fill="#A1A1AA">Laravel 11</text>

    <rect x="300" y="545" width="116" height="30" rx="15" fill="#18181B" stroke="#FBBF24"/>
    <text x="358" y="565" text-anchor="middle" fill="#FBBF24">Filament v5</text>

    <rect x="426" y="545" width="62" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="457" y="565" text-anchor="middle" fill="#A1A1AA">MIT</text>
  </g>

  <!-- Username -->
  <text x="1120" y="595" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#52525B">@jeffersongoncalves</text>

  <!-- Right visual: stacked-cards -->
  <g transform="translate(910 305)">
    <g transform="rotate(-10)">
      <rect x="-150" y="-105" width="300" height="210" rx="18" fill="#18181B" stroke="#3F3F46"/>
    </g>
    <g transform="rotate(-5)">
      <rect x="-150" y="-105" width="300" height="210" rx="18" fill="#1F1F23" stroke="#3F3F46"/>
    </g>
    <g>
      <rect x="-150" y="-105" width="300" height="210" rx="18" fill="url(#amber)"/>
      <rect x="-122" y="-74" width="150" height="14" rx="7" fill="#0A0A0B" opacity="0.55"/>
      <rect x="-122" y="-44" width="244" height="10" rx="5" fill="#0A0A0B" opacity="0.30"/>
      <rect x="-122" y="-24" width="210" height="10" rx="5" fill="#0A0A0B" opacity="0.30"/>
      <rect x="-122" y="14" width="120" height="34" rx="8" fill="#0A0A0B" opacity="0.65"/>
      <text x="-62" y="37" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#FBBF24">make()</text>
      <rect x="-122" y="62" width="244" height="10" rx="5" fill="#0A0A0B" opacity="0.30"/>
    </g>
  </g>
</svg>
